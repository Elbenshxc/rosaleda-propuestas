name: Publicar propuestas ROSALEDA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Preparar las dos propuestas
        run: unzip -q site.zip -d site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
